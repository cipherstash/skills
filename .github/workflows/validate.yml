name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install pyyaml==6.0.2
      # golang-practices tests its Go examples with go vet and go test -race.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s scripts/tests
      - name: Run skill script tests
        run: |
          for d in plugins/company-skills/skills/*/tests; do
            if ls "$d"/test_*.py >/dev/null 2>&1; then
              echo "== $d"
              python3 -m unittest discover -s "$d"
            fi
          done

  # The Go check suite (golang-practices/references/checks.md) on the
  # golang-practices examples module, with the shared golangci-lint config.
  go-checks:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        working-directory: plugins/company-skills/skills/golang-practices/examples
    steps:
      - uses: actions/checkout@v4
      # The latest patch of Go 1.26, so govulncheck sees a standard library
      # with every released security fix. Raise the minor version when
      # golangci-lint supports the next Go release.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: plugins/company-skills/skills/golang-practices/examples
          args: --config ../assets/golangci.yml --build-tags integration
      - run: golangci-lint fmt --config ../assets/golangci.yml --diff ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: go test -race -tags integration -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.186.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/golang --error --metrics off plugins/company-skills/skills/golang-practices/examples
