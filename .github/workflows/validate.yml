name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install pyyaml==6.0.2
      # The golang-practices and golang-review script tests run Go.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s scripts/tests
      - name: Run skill script tests
        run: |
          for d in plugins/company-skills/skills/*/tests; do
            if ls "$d"/test_*.py >/dev/null 2>&1; then
              echo "== $d"
              python3 -m unittest discover -s "$d"
            fi
          done

  # The Go check suite, listed with its pinned versions in golang-practices'
  # references/checks.md, over the golang-practices examples module.
  # scripts/tests/test_go_check_suite_workflow.py checks this job against that
  # list. The golang-review fixture is left out: it holds planted defects.
  go-check-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/company-skills/skills/golang-practices/examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: plugins/company-skills/skills/golang-practices/examples
          args: --config=../assets/golangci.yml
      # Files behind a build constraint load only when it holds.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: plugins/company-skills/skills/golang-practices/examples
          args: --config=../assets/golangci.yml --build-tags=integration
      - uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.15.0
          working-directory: plugins/company-skills/skills/golang-practices/examples
          args: --config=../assets/golangci.yml
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Tests with the race detector and coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
      # Files behind a build constraint compile only when it holds.
      - name: Vet for Windows
        run: GOOS=windows go vet ./...
      - name: Vet and test behind the integration tag
        run: |
          go vet -tags integration ./...
          go test -race -tags integration ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install semgrep
        working-directory: .
        run: python3 -m pip install semgrep==1.186.0
      # From the repository root, where the optional .semgrep/ rules live, and the
      # .semgrepignore that keeps the test files in the scan.
      - name: semgrep
        working-directory: .
        run: |
          local_rules=()
          if [ -d .semgrep ]; then local_rules=(--config .semgrep); fi
          semgrep scan --config p/golang "${local_rules[@]}" --error --metrics=off plugins/company-skills/skills/golang-practices/examples

  # The Python check suite, listed with its pinned versions in python-practices'
  # references/checks.md, over the python-practices examples project.
  # scripts/tests/test_python_check_suite_workflow.py checks this job against that
  # list. ruff, mypy, pytest, pytest-cov, Hypothesis and pip-audit are pinned by
  # the project's uv.lock; uv and semgrep are pinned here.
  python-check-suite:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        working-directory: plugins/company-skills/skills/python-practices/examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.10"
          enable-cache: false
      - name: Install the locked dev dependency group
        run: uv sync --locked
      - name: ruff format
        run: uv run --no-sync ruff format --check
      - name: ruff check
        run: uv run --no-sync ruff check
      - name: mypy
        run: uv run --no-sync mypy --strict src tests
      - name: Tests with branch coverage
        run: uv run --no-sync pytest --cov --cov-branch --hypothesis-profile=ci
      - name: pip-audit
        run: |
          uv export --locked --no-emit-project --output-file requirements.txt
          uv run --no-sync pip-audit --strict --disable-pip --requirement requirements.txt
      - name: Install semgrep
        working-directory: .
        run: python3 -m pip install semgrep==1.186.0
      # From the repository root, where the optional .semgrep/ rules live, and the
      # .semgrepignore that keeps the test files in the scan.
      - name: semgrep
        working-directory: .
        run: |
          local_rules=()
          if [ -d .semgrep ]; then local_rules=(--config .semgrep); fi
          semgrep scan --config p/python "${local_rules[@]}" --error --metrics=off plugins/company-skills/skills/python-practices/examples

  # The Python advisory checks in python-practices' references/checks.md. They
  # report on every pull request and never block (ADR 0006), so they run apart
  # from the suite job.
  python-advisory-checks:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.10"
          enable-cache: false
      # Compares the public API with the pull request's base branch. griffe reads
      # the base from a git worktree of the whole repository, so it runs from the
      # root, with the search path from there.
      - name: griffe check
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uvx griffe@2.4.1 check practices --search plugins/company-skills/skills/python-practices/examples/src --against "origin/$BASE_REF" --format github
